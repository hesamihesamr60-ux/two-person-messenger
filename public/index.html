
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیام‌رسان دو نفره</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }
    .app {
      max-width: 600px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px;
      background: #1f2937;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    #status {
      padding: 8px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      width: fit-content;
      max-width: 85%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 15px;
      background: #374151;
      overflow-wrap: anywhere;
    }
    .mine {
      margin-right: auto;
      background: #2563eb;
    }
    .name {
      display: block;
      font-size: 12px;
      color: #d1d5db;
      margin-bottom: 5px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #1f2937;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>💬 پیام‌رسان دو نفره</header>
    <div id="status">در حال اتصال...</div>
    <div id="messages"></div>
    <form class="input-area" id="messageForm">
      <input id="messageInput" type="text"
        placeholder="پیامت را بنویس..." maxlength="2000"
        autocomplete="off">
      <button type="submit">ارسال</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
