<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پیام‌رسان دو نفره</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #111827;
    }

    header {
      padding: 18px;
      background: #1e293b;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #334155;
    }

    #status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 5px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .mine {
      margin-right: auto;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .theirs {
      margin-left: auto;
      background: #374151;
      border-bottom-left-radius: 4px;
    }

    .username {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .text {
      font-size: 16px;
      line-height: 1.5;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      background: white;
      color: #111827;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #typing {
      min-height: 20px;
      padding: 0 15px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    💬 پیام‌رسان دو نفره
    <div id="status">در حال اتصال...</div>
  </header>

  <div id="messages"></div>

  <div id="typing"></div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="پیامت را بنویس..."
      autocomplete="off"
    >

    <button id="sendButton">
      ارسال
    </button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io();

  const messages = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const status = document.getElementById("status");
  const typing = document.getElementById("typing");

  let username = localStorage.getItem("messenger_username");

  if (!username) {
    username = prompt("نام شما چیست؟");

    if (!username || !username.trim()) {
      username = "کاربر";
    }

    username = username.trim().slice(0, 30);

    localStorage.setItem("messenger_username", username);
  }

  socket.on("connect", () => {
    status.textContent = "متصل";
    socket.emit("join", username);
  });

  socket.on("disconnect", () => {
    status.textContent = "اتصال قطع شد";
  });

  function addMessage(message) {

    const div = document.createElement("div");

    div.className =
      "message " +
      (message.username === username ? "mine" : "theirs");

    const name = document.createElement("div");
    name.className = "username";
    name.textContent = message.username;

    const text = document.createElement("div");
    text.className = "text";
    text.textContent = message.text;

    div.appendChild(name);
    div.appendChild(text);

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
  }

  async function loadMessages() {

    try {

      const response = await fetch("/api/messages");

      const data = await response.json();

      messages.innerHTML = "";

      data.forEach(addMessage);

    } catch (error) {

      console.error(error);

    }
  }

  socket.on("message", (message) => {
    addMessage(message);
  });

  function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    socket.emit("sendMessage", text);

    input.value = "";

    socket.emit("typing", false);

    input.focus();
  }

  sendButton.addEventListener("click", sendMessage);

  input.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }

  });

  let typingTimer;

  input.addEventListener("input", () => {

    socket.emit("typing", input.value.length > 0);

    clearTimeout(typingTimer);

    typingTimer = setTimeout(() => {
      socket.emit("typing", false);
    }, 1000);

  });

  socket.on("typing", (data) => {

    if (data.isTyping) {
      typing.textContent = data.username + " در حال نوشتن...";
    } else {
      typing.textContent = "";
    }

  });

  loadMessages();
</script>

</body>
</html>
